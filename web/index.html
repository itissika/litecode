<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>litecode</title>
    <script>
      // Set the global theme attribute before first paint to avoid a flash.
      // Mirrors the logic in src/lib/theme.ts (localStorage key "litecode-theme").
      (function () {
        try {
          var t = localStorage.getItem("litecode-theme");
          var dv = t === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-dv-theme", dv);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
