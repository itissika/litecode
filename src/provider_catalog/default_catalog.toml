#:schema ./provider-catalog.schema.json
#
# LiteCode provider catalog - the single source of truth for LLM providers and
# models. A provider or model that is not written here does not exist in the app.
#
# This file belongs to you: LiteCode seeds it once. A file that already loads is
# left untouched, so comments and edits survive an ordinary upgrade. A file this
# build cannot load is upgraded at startup: unknown keys and enum values are
# dropped, a provider or model that still cannot load is replaced by the
# embedded entry with the same id, and a document that still cannot load is
# replaced by this seed. The previous text is saved as provider-catalog.toml.bak.
# Edit it, then RESTART LiteCode - the catalog is read exactly once, at process start.
#
# Rules worth knowing:
#   * endpoint is the API base only. The path (/responses, /chat/completions) is
#     chosen by endpoint_type, so never write it twice.
#   * endpoint_type picks the codec: "responses" or "chat_completions".
#   * reasoning.tiers maps LiteCode's three thinking levels onto the vendor's own
#     effort literals: low = the vendor's lowest thinking level, medium = its mid
#     level (or high when it has only two), high = its top level (up to "max").
#     Leave it out for a model that takes no reasoning control.
#     Thinking OFF (compaction) sends `tiers.off` when the vendor has such a
#     literal (DeepSeek "none", Doubao "disabled") and nothing at all otherwise.
#   * reasoning.summary is the opt-in a reasoning model needs before it emits a
#     summary of its thinking: the OpenAI family never exposes raw reasoning and
#     returns nothing unless asked ("auto" / "concise" / "detailed"). Declare it
#     only for a host whose dialect is verified to accept the field.
#   * context_window is the default budget: 256000, or the model's own maximum
#     when that is smaller. context_window_max is the model's own maximum.
#   * max_output is capped at 128000, or the model's own maximum when smaller.
#   * extra_body is the escape hatch: it is merged into the request body as-is.
#   * quirks on a provider are the default for its models. A model that writes
#     quirks replaces that list; an empty list clears it. Leave the key off to
#     inherit.

version = 1

# ─────────────────────────────────────────────────────────────────────────────
# Providers
# ─────────────────────────────────────────────────────────────────────────────

[[providers]]
id = "openai"
name = "OpenAI"
endpoint = "https://api.openai.com/v1"
endpoint_type = "responses"
auth = "bearer"

[[providers]]
id = "deepseek"
name = "DeepSeek"
endpoint = "https://api.deepseek.com"
endpoint_type = "responses"
auth = "bearer"
# DeepSeek hard-requires every earlier assistant turn's reasoning text to be
# passed back in thinking mode.
quirks = ["reasoning_replay"]

[[providers]]
id = "mimo"
name = "MiMo"
endpoint = "https://api.xiaomimimo.com/v1"
endpoint_type = "responses"
auth = "bearer"
# MiMo requires reasoning pass-back too (see Deep Thinking docs).
quirks = ["reasoning_replay"]

[[providers]]
id = "ark-coding"
name = "火山方舟 Coding Plan"
endpoint = "https://ark.cn-beijing.volces.com/api/coding/v3"
endpoint_type = "responses"
auth = "bearer"
# Doubao's Responses dialect carries an explicit thinking switch next to the
# effort literal; the off literal is the switch value itself.
quirks = ["thinking_type_switch"]

[[providers]]
id = "opencode"
name = "OpenCode Zen"
endpoint = "https://opencode.ai/zen/v1"
endpoint_type = "chat_completions"
auth = "bearer"
headers = { "x-opencode-session" = "{{session_id}}" }

[[providers]]
id = "opencode-go"
name = "OpenCode Go"
endpoint = "https://opencode.ai/zen/go/v1"
endpoint_type = "chat_completions"
auth = "bearer"
headers = { "x-opencode-session" = "{{session_id}}" }

[[providers]]
id = "commandcode"
name = "Command Code Goat"
endpoint = "https://api.commandcode.ai/provider/v1"
endpoint_type = "chat_completions"
auth = "bearer"
# One effort vocabulary across the whole catalog, so it is declared once here.
tiers = { low = "low", medium = "high", high = "max" }

# Chat Completions. Omitting `thinking` leaves the official default, enabled.
# `thinking` is a codec-owned key, so preserved thinking (`clear_thinking`)
# cannot be declared here.
[[providers]]
id = "zhipu"
name = "智谱"
endpoint = "https://open.bigmodel.cn/api/paas/v4"
endpoint_type = "chat_completions"
auth = "bearer"

# Separate key and base from Coding Plan. Doubao stays on Responses so the
# thinking switch applies. Other families are Chat Completions and clear that
# switch; the chat codec would ignore it, but the model should not carry it.
[[providers]]
id = "ark-agent"
name = "火山方舟 Agent Plan"
endpoint = "https://ark.cn-beijing.volces.com/api/plan/v3"
endpoint_type = "responses"
auth = "bearer"
quirks = ["thinking_type_switch"]

# Plan key and base only. Chat Completions. GLM-5.2 is the one model whose
# docs accept `reasoning_effort`; the others are switched with `thinking.type`,
# which this codec owns, so they declare no reasoning control.
[[providers]]
id = "tencent-token"
name = "腾讯云 Token Plan"
endpoint = "https://api.lkeap.cloud.tencent.com/plan/v3"
endpoint_type = "chat_completions"
auth = "bearer"

# Plan key (`sk-sp-`) and base only. Responses, where `reasoning.effort` is the
# documented control. Image and video generation use a different API.
[[providers]]
id = "aliyun-token"
name = "阿里云百炼 Token Plan"
endpoint = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
endpoint_type = "responses"
auth = "bearer"

# ─────────────────────────────────────────────────────────────────────────────
# Models
# ─────────────────────────────────────────────────────────────────────────────

# ── OpenAI ───────────────────────────────────────────────────────────────────

[[models]]
id = "gpt-5.6-sol"
provider_id = "openai"
label = "GPT-5.6 Sol"
context_window = 256000
context_window_max = 1050000
max_output = 128000
modalities = ["text", "image"]
usage_patch = "map_max_effort_to_xhigh"
reasoning = { summary = "auto", tiers = { off = "none", low = "low", medium = "medium", high = "max" } }
# Item ids never go back on the wire, so reasoning replays as its ciphertext.
extra_body = { include = ["reasoning.encrypted_content"] }

[[models]]
id = "gpt-5.6-terra"
provider_id = "openai"
label = "GPT-5.6 Terra"
context_window = 256000
context_window_max = 1050000
