[package]
name = "litecode"
version = "0.1.8"
edition = "2024"
description = "极致轻量的终端 AI 编程助手"
license = "MIT"
build = "build.rs"

[workspace]
members = ["."]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = []
# 远程 MCP Server 支持 (~+200KB, 引入 HTTP auth/transport)
remote-mcp = []
# 后台异步 Subagent (~+50KB, 独立 tokio task 调度)
background-task = []


[dependencies]
# TerminalHub PTY backend (WezTerm) — core foundation, always on (ConPTY on Windows).
portable-pty = "0.9"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "net",
  "process",
  "io-util",
  "io-std",
  "sync",
  "macros",
  "fs",
  "time",
  "signal",
] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "blocking",
  "system-proxy",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Agent transcript / stream authority: OpenAI Responses types only (no HTTP client).
# Do not invent parallel Message/ContentBlock shapes — import from async_openai::types::responses.
async-openai = { version = "=0.41.1", default-features = false, features = ["response-types"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
similar = "2"
strsim = "0.11"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
regex = "1"
ignore = "0.4"
# ripgrep-as-library (LexicalLane): in-process text search, ships with the binary.
grep = "0.4"
glob = "0.3"
notify = "6"
ulid = "1"
petname = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = "2"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
tokenizers = { version = "0.21", default-features = false, features = [
  "onig",
] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = [
  "std",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
  "ndarray",
] }
# ANN (HNSW Cos/BF16). numkong (usearch default) does not compile under MSVC
# (ISA probe vs /arch:SSE2, then CRT name clashes in serial C). Keep usearch;
# MSVC uses built-in metrics; GCC/Clang keep numkong SIMD.
tantivy = "0.22"
tiktoken-rs = "0.12.0"
# Optional hit enrichment (grep breadcrumbs); unsupported langs fall back quietly.
# Coverage ≈ TIOBE Jul 2026 top code langs that yield AST scopes + C# (user):
# Python/C/C++/Java/C#/JS(+TS)/Rust + Go (kept). Skip VB/SQL/R.
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"

[target.'cfg(target_env = "msvc")'.dependencies]
usearch = { version = "2", default-features = false }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
usearch = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

# SSE 自实现，不引入第三方 SSE 库
# MCP 自实现 (~200 行 JSON-RPC 2.0 over stdio)，不引入第三方

[dev-dependencies]
tempfile = "3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
