name: Windows release

# Publishes Windows installers to a GitHub Release.
# Signs with Authenticode when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD exist;
# otherwise publishes unsigned artifacts (with a clear notice).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach artifacts to (workflow_dispatch)"
        required: false

jobs:
  linux-bundle:
    # Builds the Linux remote-server tarball that the Windows installer embeds
    # under extraResources (Open Remote). Uploaded as an artifact for the
    # Windows release job below. Previously this was only built manually in WSL,
    # which made the Windows package fail on `ensure_linux_bundle.ps1 -Require`.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache embed models
        uses: actions/cache@v4
        with:
          path: models/ibm-granite
          key: embed-models-${{ hashFiles('scripts/bundle_embed_model.sh') }}

      - name: Build Linux server bundle
        shell: bash
        run: |
          if [ -d web/node_modules ]; then
            echo "web deps present"  # reuse if present
          else
            (cd web && npm ci)
          fi
          bash scripts/package_linux.sh

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-bundle
          path: dist/linux/
          if-no-files-found: error

  release:
    needs: linux-bundle
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-server-bundle
          path: dist/linux/

      # checkout mtimes are "now"; artifact mtimes are older and would trip
      # ensure_linux_bundle.ps1 -Require stale check.
      - name: Refresh Linux bundle timestamps
        shell: pwsh
        run: Get-ChildItem -LiteralPath dist/linux -File | ForEach-Object { $_.LastWriteTime = Get-Date }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Cache embed models
        uses: actions/cache@v4
        with:
          path: models/ibm-granite
          key: embed-models-${{ hashFiles('scripts/bundle_embed_model.sh') }}

      - name: Build Windows installers
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            Write-Host "Code signing secrets detected — signing enabled"
            # Enable electron-builder signing for this job
            (Get-Content desktop/package.json -Raw) -replace '"signAndEditExecutable": false','"signAndEditExecutable": true' |
              Set-Content -Encoding utf8 desktop/package.json
          } else {
            Write-Host "No signing secrets — building unsigned artifacts"
          }
          ./scripts/package_win.ps1

      - name: SHA256SUMS
        shell: pwsh
        run: |
          Get-FileHash desktop/out/Litecode-*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii desktop/out/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          body: |
            > ⚠️ Unsigned build — Windows SmartScreen may warn on first run.
            >
            > Installer (`Litecode-Setup-x64.exe`) or portable (`Litecode-Portable-x64.exe`).
          files: |
            desktop/out/Litecode-Portable-*.exe
            desktop/out/Litecode-Setup-*.exe
            desktop/out/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
