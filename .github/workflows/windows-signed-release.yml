name: Windows release

# Publishes the slim Windows NSIS installer to a GitHub Release, plus the
# on-demand runtime components (embed model, Linux remote-server tar) and
# litecode-components.json. The installed app downloads those components from
# releases/download/v<version>/ on first use, so the tag MUST be v<version>.
# Signs with Authenticode when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD exist;
# otherwise publishes unsigned artifacts (with a clear notice).
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach artifacts to (workflow_dispatch)"
        required: false

jobs:
  linux-bundle:
    # Builds the slim Linux remote-server tarball (kernel + web, no embed).
    # Published as a Release asset; Open Remote downloads it on demand.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Linux server bundle
        shell: bash
        env:
          LITECODE_CHANNEL: official
          LITECODE_BUNDLE_MODEL: "0"
        run: |
          if [ -d web/node_modules ]; then
            echo "web deps present"  # reuse if present
          else
            (cd web && npm ci)
          fi
          bash scripts/package_linux.sh

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-bundle
          path: dist/linux/
          if-no-files-found: error

  release:
    needs: linux-bundle
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-server-bundle
          path: dist/linux/

      - name: Check tag matches product version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          . ./scripts/product_version.ps1
          $version = Get-LitecodeProductVersion -Root (Get-Location).Path
          $desktop = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($desktop -ne $version) {
            throw "desktop/package.json version $desktop != Cargo.toml $version (client fetches components for its own version)"
          }
          if ($env:TAG -ne "v$version") {
            throw "Release tag '$($env:TAG)' must be 'v$version': installed apps fetch components from releases/download/v$version/"
          }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Cache embed models
        uses: actions/cache@v4
        with:
          path: models/ibm-granite
          key: embed-models-${{ hashFiles('scripts/bundle_embed_model.sh') }}

      - name: Build Windows installers
        shell: pwsh
        env:
          LITECODE_CHANNEL: official
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            Write-Host "Code signing secrets detected — signing enabled"
            # Enable electron-builder signing for this job
            (Get-Content desktop/package.json -Raw) -replace '"signExecutable": false','"signExecutable": true' |
              Set-Content -Encoding utf8 desktop/package.json
          } else {
            Write-Host "No signing secrets — building unsigned artifacts"
          }
          ./scripts/package_win.ps1

      - name: Stage on-demand components + manifest
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          node scripts/build_components.mjs --tag $env:TAG --repo "${{ github.repository }}" --out dist/components
          if ($LASTEXITCODE -ne 0) { throw "build_components.mjs failed" }

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/out/Litecode-Setup-*.exe) + @(Get-ChildItem dist/components -File)
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii desktop/out/SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          append_body: true
          body: |
            ## 安装包

            - `Litecode-Setup-*-x64.exe` — 安装版（瘦包；嵌入模型与 Linux 远程包首次使用时自动下载）
            - `litecode-components.json` — 按需组件清单（客户端读取，勿删）
            - `litecode-embed-*.tar.gz` / `litecode-server-linux-x64.tar.gz` — 按需组件
            - `SHA256SUMS.txt` — 校验和

            > 未配置 `WIN_CSC_*` 时为未签名构建；SmartScreen 可能在首次运行时提示。
          files: |
            desktop/out/Litecode-Setup-*.exe
            desktop/out/SHA256SUMS.txt
            dist/components/litecode-components.json
            dist/components/litecode-embed-*.tar.gz
            dist/components/litecode-server-linux-x64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
