# Five-harness Terminal-Bench panel.
#
# To add a task: add its public source image and its prebaked eval image below,
# then run:
#   python3 eval/harbor/bench5/run_matrix.py --campaign <this file> --preflight-only
# The runner and collector both read this file; there is no hard-coded task
# tuple to forget.
schema_version: 1
name: bench5
description: LiteCode x codex/pi/opencode/grok-build on four Terminal-Bench tasks
run_prefix: bench5
model: deepseek/deepseek-flash

jobs_root: ${HOME}/eval/jobs/bench5
dataset: ${HOME}/eval/datasets/bench5
source_dataset: ${HOME}/tb2
egress_log: ${HOME}/eval/logs/egress.jsonl
egress_root: http://172.17.0.1:8399

concurrency: 5
retry_rounds: 2
job_timeout_sec: 5400
min_free_gb: 12

price_usd_per_million:
  uncached_input: 0.15
  cached_input: 0.003
  output: 0.60

strict:
  # Every task x harness cell must exist in the report.
  require_expected_cells: true
  # Non-LiteCode cells need egress rows with usage; LiteCode needs the usage
  # line to agree with agent_result.
  require_token_complete: true
  # Every selected cell must have a parseable ATIF trajectory.
  require_trajectory: true
  # A verifier-passing trial with a non-zero harness exit is still a pass but
  # is marked '通过（非零退出）'. Set this true to make it non-rankable.
  require_clean_exit: false

harnesses:
  - id: litecode
    token_source: litecode
    # LiteCode is uploaded by its adapter, not installed in the image.
  - id: codex
    token_source: egress
    probe: ". /root/.nvm/nvm.sh; codex --version"
  - id: pi
    token_source: egress
    probe: ". /root/.nvm/nvm.sh; pi --version"
  - id: opencode
    token_source: egress
    probe: ". /root/.nvm/nvm.sh; opencode --version"
  - id: grok-build
    token_source: egress
    probe: "PATH=/root/.grok/bin:$PATH grok --version"

tasks:
  - name: prove-plus-comm
    image: litecode-eval/prove-plus-comm:bench5
    source_image: alexgshaw/prove-plus-comm:20251031
    difficulty: easy
    category: software-engineering
  - name: polyglot-c-py
    image: litecode-eval/polyglot-c-py:bench5
    source_image: alexgshaw/polyglot-c-py:20251031
    difficulty: medium
    category: software-engineering
  - name: password-recovery
    image: litecode-eval/password-recovery:bench5
    source_image: alexgshaw/password-recovery:20251031
    difficulty: hard
    category: security
  - name: cancel-async-tasks
    image: litecode-eval/cancel-async-tasks:bench5
    source_image: alexgshaw/cancel-async-tasks:20251031
    difficulty: hard
    category: software-engineering