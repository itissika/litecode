harness:
  id: opencode
  name: eval.harbor.prebaked_agents:PrebakedOpenCode
  protocol: openai
  params:
    # opencode has no reasoning-effort flag; the level is a per-model request
    # option in its config overlay, passed through to the provider SDK.
    # DeepSeek's own default is already high, so the knob is an explicit
    # record of intent rather than the only thing keeping the run at high.
    opencode_config:
      provider:
        deepseek:
          models:
            deepseek-flash:
              options:
                reasoningEffort: high