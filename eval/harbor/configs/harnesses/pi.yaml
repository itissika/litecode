# Layer 2 of 4: the agent CLI under test, run as a Harbor installed agent.
# The prebaked adapter skips the per-trial npm/nvm install because the eval
# task image already carries this exact CLI; everything else is the stock Pi
# adapter (same model connection, config, run command and trajectory).
harness:
  id: pi
  name: eval.harbor.prebaked_agents:PrebakedPi
  protocol: openai
  # Pi refuses a custom base_url unless the wire format is explicit; without
  # this it sees a user-supplied URL with no model_api and raises before the
  # trial starts. The format is the one Pi actually speaks to /chat/completions.
  model_api_format: openai_chat_completions
  params:
    # pi's thinking level; Harbor compiles this to `pi --thinking high`.
    reasoning_effort: high