# LiteCode is the only harness allowed to carry a changed default config:
# eval/profile.toml is the scored surface and is applied by the adapter.
#
# Unlike the other four, LiteCode resolves its endpoint from the provider
# catalog compiled into the binary (official DeepSeek), so this agent has no
# base_url and does not travel through the egress proxy. Its token accounting
# is the CLI's own final usage line, cross-checked against the same line in the
# trial artifact; the other four are measured only at the proxy.
harness:
  id: litecode
  name: eval.harbor.litecode_agent:LiteCode
  protocol: openai-responses
  egress: false
  # The adapter reads its key from this variable; Harbor injects it.
  model_api_key_name: LITECODE_API_KEY
  params: {}