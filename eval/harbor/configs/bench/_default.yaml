# Layer 1 of 4: invariants shared by every job in this bench.
# Merge order is bench -> harness -> model -> job, later wins, the same order
# workbuddy-bench uses in configs/README.md.
bench:
  n_attempts: 1
  n_concurrent_trials: 4
  # Installing a CLI inside every trial is slow (opencode: apt + nvm + npm ran
  # past 360 s once); the setup window is the harness's, not the task's.
  agent_setup_timeout_multiplier: 4.0
  jobs_dir: results/harbor
  environment:
    type: docker

# Deliberately absent: context_window, max_output_tokens. Both come from the
# model itself; an override here would turn the model's own limits into an
# artifact of this bench.
