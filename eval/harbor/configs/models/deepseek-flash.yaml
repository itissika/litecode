# Layer 3 of 4: model identity and connection. Names only - the values of the
# two env vars below never live in this repository.
model:
  # provider/model; Harbor splits this into provider=deepseek, model=deepseek-flash.
  name: deepseek/deepseek-flash
  # Both protocols are native to the backend; a harness must name one of them.
  protocols: [openai, openai-responses]
  # Root of the egress proxy. The resolver appends /r/<run_id>-<harness>/v1,
  # so the run id - not the file - decides what a row belongs to.
  backend_url_env: EVAL_EGRESS_BASE_URL
  # Harbor needs the name of the key variable for its preflight check. The
  # proxy replaces whatever value arrives with the key it read from its file.
  backend_key_env: DEEPSEEK_API_KEY
  # No params: no temperature, no max tokens, no context window. That is the
  # whole point of this layer being empty.
  params: {}
