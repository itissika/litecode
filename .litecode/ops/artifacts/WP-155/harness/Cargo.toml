# WP-155 open-path harness (R1-A). Archived copy (artifact); build into the shared main target only with backend_mid approval.
# (CARGO_TARGET_DIR=/workspace/litecode/target) and deleted with its artifacts afterwards.
[package]
name = "wp155_open_harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
litecode = { path = "../../../../.." }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde_json = "1"
anyhow = "1"

# Same release profile as the main crate so the dependency artifacts are reused.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
